[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssd-llm"
version = "0.1.0"
description = "AnyHardware AI - adaptive CPU + RAM + SSD runner for GGUF language models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "AnyHardware AI contributors" }]
keywords = ["llm", "gguf", "llama.cpp", "cpu", "local", "offline", "browser-automation", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[tool.setuptools.packages.find]
include = ["ssd_llm*"]

[tool.setuptools.package-data]
ssd_llm = ["static/*"]

[project.urls]
Homepage = "https://github.com/mahmouddawod-it/AnyHardware-AI"
Repository = "https://github.com/mahmouddawod-it/AnyHardware-AI"
Issues = "https://github.com/mahmouddawod-it/AnyHardware-AI/issues"

[project.scripts]
ssd-llm = "ssd_llm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
